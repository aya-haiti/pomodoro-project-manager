name: Build & Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Import check
        run: python -c "import PySide6, mysql.connector, pygame; print('imports ok')"
      - name: Build (PyInstaller, one-folder)
        run: pyinstaller --noconfirm --windowed --name PomodoroManager run.py
      - name: Package
        shell: pwsh
        run: |
          Copy-Item -Recurse assets dist/PomodoroManager/assets
          Copy-Item pomodoro_app.sql, README.md dist/PomodoroManager/
          Compress-Archive -Path dist/PomodoroManager/* -DestinationPath PomodoroManager-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PomodoroManager-windows
          path: PomodoroManager-windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PomodoroManager-windows
      - uses: softprops/action-gh-release@v2
        with:
          files: PomodoroManager-windows.zip
          generate_release_notes: true
